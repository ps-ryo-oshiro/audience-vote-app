<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>管理者ダッシュボード</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <div class="topbar">
        <div class="brand">管理者モード</div>
        <nav>
          <a href="index.html">投票ページ</a>
          <a href="admin.html">ダッシュボード</a>
        </nav>
      </div>
    </header>

    <main class="container admin-shell">
      <div class="page-header">
        <h1>管理者ダッシュボード</h1>
      </div>

      <section id="login-panel" class="card auth-panel">
        <h2>ログイン</h2>
        <form id="admin-login-form">
          <div class="form-row">
            <label for="admin-id">ID</label>
            <input id="admin-id" type="text" autocomplete="username" />
          </div>
          <div class="form-row">
            <label for="admin-password">パスワード</label>
            <input id="admin-password" type="password" autocomplete="current-password" />
          </div>
          <button type="submit" class="primary-button">ログイン</button>
        </form>
        <div id="login-message" class="message hidden" role="alert"></div>
      </section>

      <section id="dashboard-panel" class="card dashboard-panel hidden">
        <div class="status-card">
          <div>
            <p style="margin:0 0 8px; color: var(--muted);">投票受付</p>
            <button id="toggle-voting-status" class="secondary-button" type="button"></button>
          </div>
          <div>
            <p style="margin:0; color: var(--muted);">オーディエンス賞候補</p>
            <strong id="winner-name">未判定</strong>
          </div>
        </div>

        <p class="helper-text">総票数: <strong id="total-votes-count">0</strong>票<span id="excluded-votes-note" class="excluded-note hidden"></span></p>

        <div class="grid-two">
          <div>
            <h3>部門別集計</h3>
            <div id="summary-table-wrap"></div>
          </div>
          <div>
            <h3>全体集計</h3>
            <table>
              <thead>
                <tr>
                  <th>順位</th>
                  <th>No</th>
                  <th>アプリ名</th>
                  <th>部門</th>
                  <th>得票数</th>
                </tr>
              </thead>
              <tbody id="global-results-body"></tbody>
            </table>
          </div>
        </div>
      </section>

      <section id="participation-panel" class="card participation-panel hidden">
        <h2>表示切替</h2>
        <p class="helper-text">表示中の敗者復活チーム: <strong id="participation-counter">0 / 0</strong></p>
        <div id="participation-message" class="message hidden" role="alert"></div>

        <div class="grid-two">
          <div>
            <h3>本戦チーム</h3>
            <table>
              <thead>
                <tr>
                  <th>No</th>
                  <th>アプリ名</th>
                  <th>部門</th>
                  <th>状態</th>
                </tr>
              </thead>
              <tbody id="finalist-list-body"></tbody>
            </table>
          </div>
          <div>
            <h3>敗者復活候補</h3>
            <table>
              <thead>
                <tr>
                  <th>No</th>
                  <th>アプリ名</th>
                  <th>部門</th>
                  <th>表示</th>
                </tr>
              </thead>
              <tbody id="candidate-list-body"></tbody>
            </table>
          </div>
        </div>
      </section>
    </main>

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="admin.js"></script>
  </body>
</html>
