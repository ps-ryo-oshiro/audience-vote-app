<!DOCTYPE html>
<html lang="ja" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" id="meta-theme-color" />
    <title>オーディエンス投票 | AI爆速アプリコンテスト</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="vote.css" />
  </head>
  <body>
    <div class="shell">
      <header class="vote-header">
        <span class="vote-header__brand">AI爆速アプリコンテスト</span>
        <div class="vote-header__right">
          <div class="theme-toggle" role="group" aria-label="表示テーマ">
            <button type="button" class="theme-toggle__btn is-active" data-theme-set="light" aria-pressed="true">LIGHT</button>
            <button type="button" class="theme-toggle__btn" data-theme-set="dark" aria-pressed="false">DARK</button>
          </div>
          <span class="status-pill" id="vote-status-badge"><i class="status-pill__dot"></i>受付確認中</span>
        </div>
      </header>

      <section class="hero">
        <span class="hero__streak hero__streak--1"></span>
        <span class="hero__streak hero__streak--2"></span>
        <span class="hero__streak hero__streak--3"></span>
        <div class="hero__inner">
          <p class="hero__eyebrow">AUDIENCE VOTE</p>
          <h1 class="hero__title">推しアプリを<br /><span class="hero__accent">1本</span>選べ。</h1>
          <div class="hero__chips">
            <span class="hero__chip hero__chip--1">1人1票</span>
            <span class="hero__chip hero__chip--2" id="entry-count">全0エントリー</span>
          </div>
        </div>
      </section>

      <form id="vote-form">
        <div id="section-list"></div>

        <div class="submit-bar">
          <p class="vote-message hidden" id="vote-message" role="status" aria-live="polite"></p>
          <button type="submit" class="submit-btn" id="vote-submit" disabled>
            <span class="submit-btn__label" id="vote-submit-label">アプリを選択してください</span>
            <span class="submit-btn__shimmer" aria-hidden="true"></span>
          </button>
        </div>
      </form>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="app.js"></script>
  </body>
</html>
